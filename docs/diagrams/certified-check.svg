<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="certified-check-title certified-check-desc">
  <title id="certified-check-title">How writ check works now: answer, certificate, Lean check</title>
  <desc id="certified-check-desc">writ check reads a model and its claims, prints its report and writes MODEL.cert.json; writ-cert, compiled from Lean, explores the model itself, a checker proved sound against the kernel semantics holds writ's answer to that graph, and its verdict becomes the report's last line; optionally the same model becomes Lean theorems through writ_model and by writ.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .name { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #cdd6f4; }
      .sub  { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #a6adc8; }
      .tag  { font-family: 'Geist Mono', monospace; font-size: 7px; letter-spacing: 0.08em; }
      .lbl  { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.06em; fill: #a6adc8; }
      .zone { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.14em; fill: rgba(205,214,244,0.45); }
      .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.18em; fill: #a6adc8; }
      .title { font-family: 'Instrument Serif', serif; font-size: 28px; fill: #cdd6f4; }
      .aside { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 14px; fill: #bac2de; }
    </style>
    <marker id="cc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a6adc8"/>
    </marker>
    <marker id="cc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cba6f7"/>
    </marker>
    <marker id="cc-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#89b4fa"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#1e1e2e"/>

  <!-- header -->
  <text class="eyebrow" x="48" y="56">WRIT · WHAT HAPPENS ON EVERY CHECK</text>
  <text class="title" x="48" y="96">Every answer, checked twice</text>

  <!-- zones -->
  <rect x="48" y="160" width="600" height="344" rx="8" fill="rgba(205,214,244,0.02)" stroke="rgba(205,214,244,0.12)" stroke-width="0.8"/>
  <rect x="64" y="164" width="112" height="12" rx="2" fill="#1e1e2e"/>
  <text class="zone" x="120" y="173" text-anchor="middle">WRIT · OCAML</text>

  <rect x="688" y="368" width="520" height="136" rx="8" fill="rgba(205,214,244,0.02)" stroke="rgba(205,214,244,0.12)" stroke-width="0.8"/>
  <rect x="704" y="372" width="188" height="12" rx="2" fill="#1e1e2e"/>
  <text class="zone" x="798" y="381" text-anchor="middle">WRIT-CERT · COMPILED FROM LEAN</text>

  <!-- arrows (drawn before boxes) -->
  <!-- input -> writ check -->
  <line x1="280" y1="236" x2="372" y2="236" stroke="#a6adc8" stroke-width="1.2" marker-end="url(#cc-arrow)"/>

  <!-- writ check -> report -->
  <line x1="616" y1="236" x2="940" y2="236" stroke="#a6adc8" stroke-width="1.2" marker-end="url(#cc-arrow)"/>
  <rect x="752" y="216" width="56" height="12" rx="2" fill="#1e1e2e"/>
  <text class="lbl" x="780" y="225" text-anchor="middle">ANSWERS</text>

  <!-- writ check -> certificate -->
  <line x1="496" y1="272" x2="496" y2="396" stroke="#a6adc8" stroke-width="1.2" marker-end="url(#cc-arrow)"/>
  <rect x="504" y="328" width="48" height="12" rx="2" fill="#1e1e2e"/>
  <text class="lbl" x="528" y="337" text-anchor="middle">WRITES</text>

  <!-- certificate -> explore -->
  <line x1="616" y1="436" x2="708" y2="436" stroke="#a6adc8" stroke-width="1.2" marker-end="url(#cc-arrow)"/>
  <rect x="640" y="416" width="40" height="12" rx="2" fill="#1e1e2e"/>
  <text class="lbl" x="660" y="425" text-anchor="middle">MODEL</text>

  <!-- explore -> checker -->
  <line x1="872" y1="436" x2="940" y2="436" stroke="#a6adc8" stroke-width="1.2" marker-end="url(#cc-arrow)"/>
  <rect x="880" y="416" width="56" height="12" rx="2" fill="#1e1e2e"/>
  <text class="lbl" x="908" y="425" text-anchor="middle">OWN GRAPH</text>

  <!-- certificate -> checker: writ's answer, under the search -->
  <path d="M 496,472 V 544 Q 496,552 504,552 H 1056 Q 1064,552 1064,544 V 476"
        fill="none" stroke="#a6adc8" stroke-width="1.2" marker-end="url(#cc-arrow)"/>
  <rect x="736" y="528" width="88" height="12" rx="2" fill="#1e1e2e"/>
  <text class="lbl" x="780" y="537" text-anchor="middle">WRIT'S ANSWER</text>

  <!-- checker -> report: the verdict line -->
  <line x1="1064" y1="400" x2="1064" y2="276" stroke="#cba6f7" stroke-width="1.2" marker-end="url(#cc-arrow-accent)"/>
  <rect x="1072" y="328" width="56" height="12" rx="2" fill="#1e1e2e"/>
  <text class="lbl" x="1100" y="337" text-anchor="middle" fill="#cba6f7">VERDICT</text>

  <!-- input -> by writ: optional, the same model as Lean theorems -->
  <line x1="180" y1="272" x2="180" y2="572" stroke="#89b4fa" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#cc-arrow-link)"/>
  <rect x="188" y="412" width="72" height="12" rx="2" fill="#1e1e2e"/>
  <text class="lbl" x="224" y="421" text-anchor="middle" fill="#89b4fa">WRIT_MODEL</text>

  <!-- nodes -->
  <!-- input -->
  <rect x="80" y="200" width="200" height="72" rx="6" fill="#1e1e2e"/>
  <rect x="80" y="200" width="200" height="72" rx="6" fill="rgba(186,194,222,0.10)" stroke="#a6adc8" stroke-width="1"/>
  <rect x="88" y="206" width="36" height="12" rx="2" fill="none" stroke="rgba(166,173,200,0.40)" stroke-width="0.8"/>
  <text class="tag" x="106" y="215" text-anchor="middle" fill="#a6adc8">INPUT</text>
  <text class="name" x="180" y="240" text-anchor="middle">Model + claims</text>
  <text class="sub" x="180" y="256" text-anchor="middle">river.writ · river.claims</text>

  <!-- writ check -->
  <rect x="376" y="200" width="240" height="72" rx="6" fill="#1e1e2e"/>
  <rect x="376" y="200" width="240" height="72" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="1"/>
  <rect x="384" y="206" width="28" height="12" rx="2" fill="none" stroke="rgba(205,214,244,0.40)" stroke-width="0.8"/>
  <text class="tag" x="398" y="215" text-anchor="middle" fill="#cdd6f4">CLI</text>
  <text class="name" x="496" y="240" text-anchor="middle">writ check</text>
  <text class="sub" x="496" y="256" text-anchor="middle">builds the space · answers</text>

  <!-- certificate -->
  <rect x="376" y="400" width="240" height="72" rx="6" fill="#1e1e2e"/>
  <rect x="376" y="400" width="240" height="72" rx="6" fill="rgba(205,214,244,0.05)" stroke="#bac2de" stroke-width="1"/>
  <rect x="384" y="406" width="32" height="12" rx="2" fill="none" stroke="rgba(186,194,222,0.40)" stroke-width="0.8"/>
  <text class="tag" x="400" y="415" text-anchor="middle" fill="#bac2de">FILE</text>
  <text class="name" x="496" y="440" text-anchor="middle">MODEL.cert.json</text>
  <text class="sub" x="496" y="456" text-anchor="middle">model + claims + answer · no graph</text>

  <!-- explore: untrusted -->
  <rect x="712" y="400" width="160" height="72" rx="6" fill="#1e1e2e"/>
  <rect x="712" y="400" width="160" height="72" rx="6" fill="rgba(205,214,244,0.02)" stroke="rgba(205,214,244,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="720" y="406" width="64" height="12" rx="2" fill="none" stroke="rgba(205,214,244,0.30)" stroke-width="0.8"/>
  <text class="tag" x="752" y="415" text-anchor="middle" fill="#a6adc8">UNTRUSTED</text>
  <text class="name" x="792" y="440" text-anchor="middle">Explore + search</text>
  <text class="sub" x="792" y="456" text-anchor="middle">BFS · Tarjan · Emerson–Lei</text>

  <!-- proved checker: focal -->
  <rect x="944" y="400" width="240" height="72" rx="6" fill="#1e1e2e"/>
  <rect x="944" y="400" width="240" height="72" rx="6" fill="rgba(203,166,247,0.12)" stroke="#cba6f7" stroke-width="1.2"/>
  <rect x="952" y="406" width="52" height="12" rx="2" fill="none" stroke="rgba(203,166,247,0.50)" stroke-width="0.8"/>
  <text class="tag" x="978" y="415" text-anchor="middle" fill="#cba6f7">PROVED</text>
  <text class="name" x="1064" y="440" text-anchor="middle">Checker, proved sound</text>
  <text class="sub" x="1064" y="456" text-anchor="middle">reach_iff · checkCert_sound</text>

  <!-- report -->
  <rect x="944" y="200" width="240" height="72" rx="6" fill="#1e1e2e"/>
  <rect x="944" y="200" width="240" height="72" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="1"/>
  <rect x="952" y="206" width="40" height="12" rx="2" fill="none" stroke="rgba(205,214,244,0.40)" stroke-width="0.8"/>
  <text class="tag" x="972" y="215" text-anchor="middle" fill="#cdd6f4">OUTPUT</text>
  <text class="name" x="1064" y="240" text-anchor="middle">Your report</text>
  <text class="sub" x="1064" y="256" text-anchor="middle">last line: certified | DISAGREES</text>

  <!-- by writ: optional -->
  <rect x="80" y="576" width="200" height="72" rx="6" fill="#1e1e2e"/>
  <rect x="80" y="576" width="200" height="72" rx="6" fill="rgba(205,214,244,0.02)" stroke="rgba(205,214,244,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="88" y="582" width="56" height="12" rx="2" fill="none" stroke="rgba(137,180,250,0.50)" stroke-width="0.8"/>
  <text class="tag" x="116" y="591" text-anchor="middle" fill="#89b4fa">OPTIONAL</text>
  <text class="name" x="180" y="616" text-anchor="middle">by writ</text>
  <text class="sub" x="180" y="632" text-anchor="middle">property → Lean theorem</text>

  <!-- editorial aside -->
  <text class="aside" x="712" y="316">No writ-cert? The report says “not certified” —</text>
  <text class="aside" x="712" y="336">a missing check is never a silent pass.</text>

  <!-- legend -->
  <line x1="48" y1="672" x2="1232" y2="672" stroke="rgba(205,214,244,0.10)" stroke-width="0.8"/>
  <text class="eyebrow" x="48" y="700">LEGEND</text>
  <rect x="352" y="688" width="24" height="16" rx="4" fill="rgba(203,166,247,0.12)" stroke="#cba6f7" stroke-width="1"/>
  <text class="lbl" x="384" y="700">PROVED SOUND IN LEAN</text>
  <rect x="560" y="688" width="24" height="16" rx="4" fill="none" stroke="rgba(205,214,244,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
  <text class="lbl" x="592" y="700">UNTRUSTED — CAN ONLY LOSE AN ANSWER</text>
  <rect x="832" y="688" width="24" height="16" rx="4" fill="rgba(205,214,244,0.05)" stroke="#bac2de" stroke-width="1"/>
  <text class="lbl" x="864" y="700">FILE ON DISK</text>
  <line x1="1000" y1="696" x2="1032" y2="696" stroke="#89b4fa" stroke-width="1" stroke-dasharray="4,3"/>
  <text class="lbl" x="1040" y="700">OPTIONAL PATH</text>
</svg>
