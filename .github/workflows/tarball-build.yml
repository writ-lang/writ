# Build the portable release tarball for both architectures, then install and
# use it. Called, never triggered: ci.yml (upload: false) and release.yml
# (upload: true) share this build, so the check builds what ships. Nothing else
# exercises the static profile, the stdlib copy or install.sh.

name: tarball-build

on:
  workflow_call:
    inputs:
      upload:
        description: "Keep the tarball as an artifact for the caller to publish"
        type: boolean
        default: false

jobs:
  build:
    # Native runners, never QEMU (see image-build.yml). No macOS: it has no
    # static libc, so a mac binary would not be portable.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile's compiler, so tarball and image match.
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - run: opam install -y dune

      - id: v
        run: echo "version=$(sed -n 's/^(version \(.*\))/\1/p' dune-project)" >> "$GITHUB_OUTPUT"

      # opam exec around make, not dune: the Makefile finds dune via
      # scripts/with-ocaml.sh. `make release` also builds writ-cert in docker.
      - name: build the tarball
        run: opam exec -- make release

      - name: it is named for the version dune-project declares
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          name="writ-${VERSION}-linux-${{ matrix.arch }}"
          test -f "dist/${name}.tar.gz" || {
            echo "no dist/${name}.tar.gz — what make release built:" >&2
            ls -l dist >&2; exit 1; }
          ( cd dist && sha256sum -c "${name}.tar.gz.sha256" )

      # Install and run the asset itself, not the tree it came from.
      - name: unpack it, install it, and use it
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          name="writ-${VERSION}-linux-${{ matrix.arch }}"
          tar xzf "dist/${name}.tar.gz" -C "$RUNNER_TEMP"

          # Outside the build tree and PATH, so nothing resolves by accident.
          prefix="$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/$name/install.sh" "$prefix"
          export PATH="$prefix/bin:$PATH"

          got=$(writ --version | head -n 1)
          test "$got" = "writ ${VERSION}" || {
            echo "the binary reports '$got', dune-project says ${VERSION}" >&2
            exit 1; }

          # Resolve the stdlib the installed way, with $WRIT_LIB unset.
          work="$RUNNER_TEMP/work"; mkdir -p "$work"; cd "$work"
          printf '%s\n' \
            '(load "stdlib.writ")' \
            '(schema s (type v (lo hi)) (type box (arrow f (to v))))' \
            '(instance i s (box b (f lo)))' \
            '(use s)' '(initial i)' \
            '(transition raise (when (is b.f lo)) (do (set b.f hi)))' \
            > smoke.writ
          writ check smoke.writ > smoke.out
          grep -q 'states: 2' smoke.out

          grep -q '^certified:' smoke.out || {
            echo "an installed writ check was not certified:" >&2
            cat smoke.out >&2; exit 1; }

          # ct.rules is not .writ; a stdlib glob narrowed to *.writ would drop it.
          printf '%s\n' '(load "ct.rules")' > smoke.rules
          writ derive smoke.writ smoke.rules reach | grep -q '(3 rows)'

          # Only the tarball ships writ-lsp, so it is checked here; `exit` stops it.
          frame() { printf 'Content-Length: %d\r\n\r\n%s' "${#1}" "$1"; }
          { frame '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
            frame '{"jsonrpc":"2.0","method":"exit"}'
          } | writ-lsp | grep -q '"capabilities"'

          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | writ-mcp | grep -q '"protocolVersion"'

          echo "the tarball installs, all four binaries run, and checks are certified"

      # A dynamic binary still works on the machine that built it, so this is
      # the only check that the release is portable.
      - name: the binaries must be statically linked
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          name="writ-${VERSION}-linux-${{ matrix.arch }}"
          for exe in writ writ-lsp writ-mcp writ-cert; do
            out=$(ldd "$RUNNER_TEMP/$name/bin/$exe" 2>&1 || true)
            case $out in
              *"not a dynamic executable"*|*"statically linked"*) ;;
              *) echo "$exe is dynamically linked, so the tarball is not portable:" >&2
                 echo "$out" >&2; exit 1 ;;
            esac
          done
          echo "static — any linux/${{ matrix.arch }} will run these"

      - if: inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
