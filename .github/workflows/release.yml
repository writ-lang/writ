# On a version tag, attach the tarballs (built by tarball-build.yml) to a GitHub
# release. The image is published by image-publish.yml; the opam package needs
# nothing beyond the tag. Every artifact takes its version from dune-project,
# not the tag, so the first job checks they agree. workflow_dispatch builds and
# checks everything but publishes nothing.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Before anything is built or uploaded, so a wrong tag costs nothing.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the rule compares this tag against every other one

      - id: v
        run: echo "version=$(sed -n 's/^(version \(.*\))/\1/p' dune-project)" >> "$GITHUB_OUTPUT"

      # Run the same script locally before pushing a tag.
      - name: the tag and dune-project must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh scripts/check-release-tag.sh "${GITHUB_REF_NAME}"

      - run: sh scripts/check-versions.sh

  # The same build ci.yml runs, so what ships is what was checked.
  tarball:
    needs: version
    uses: ./.github/workflows/tarball-build.yml
    with:
      upload: true

  # One job writes the release, so the body is generated once.
  publish:
    needs: [version, tarball]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tarball-*
          merge-multiple: true

      # The body leads with the annotated tag's message; a lightweight tag
      # leaves only the generated notes.
      - name: release notes from the tag annotation
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          git fetch --force --tags --depth=1 origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}"
            echo
            body=$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}")
            [ -n "$body" ] && { echo "$body"; echo; } || true
            cat <<EOF
          ## Install

          **A tarball**, for a machine with no OCaml and no opam. Statically
          linked: no libc version floor, so it runs on any Linux of its
          architecture. It carries \`writ\`, \`writ-lsp\`, \`writ-mcp\` and the
          standard library.

          \`\`\`sh
          v=writ-${VERSION}-linux-\$(uname -m)
          sha256sum -c \$v.tar.gz.sha256
          tar xzf \$v.tar.gz && cd \$v && ./install.sh     # -> ~/.local
          \`\`\`

          **The container image**, amd64 and arm64:

          \`\`\`sh
          docker run --rm ghcr.io/${{ github.repository }}:${VERSION} --version
          \`\`\`

          **As an opam package**, pinned to this tag:

          \`\`\`sh
          opam pin add writ git+https://github.com/${{ github.repository }}#${GITHUB_REF_NAME}
          \`\`\`

          macOS has no static libc, so there is no mac tarball here: build one
          from this tag with \`make release STATIC=0\`.
          EOF
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          body_path: RELEASE_BODY.md
          generate_release_notes: true
