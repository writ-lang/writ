# Build, test and lint on every pull request, then build the release tarball
# with the same workflow release.yml uses.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Needs no toolchain; catches version drift on the bumping pull request.
      - run: sh scripts/check-versions.sh

      # 5.2 matches the Dockerfile and .ocamlformat (5.4 reserves `effect`).
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      # No library dependencies. dune refuses any ocamlformat but the one
      # .ocamlformat declares.
      - run: opam install -y dune ocamlformat.0.29.0

      # The Makefile finds dune through scripts/with-ocaml.sh, which checks PATH.
      - run: opam exec -- make build

      - run: opam exec -- make test

      - run: opam exec -- make lint

      # writ.opam is generated by the build above but committed, so any diff
      # means someone bumped dune-project without rebuilding.
      - name: writ.opam must match dune-project
        run: |
          git diff --exit-code writ.opam || {
            echo "writ.opam is out of date — run \`make build\` and commit it." >&2
            exit 1; }

      # An opam pin runs `dune subst`, which sets the version from `git describe`
      # (with its `v`); tooling/cli/dune strips it. No other build runs subst,
      # so stage a tagged clone and check what it reports.
      - name: an opam pin must report the version the tarball does
        run: |
          set -eu
          # The switch is local to the workspace; name it before leaving.
          sw=$(opam switch show)

          work="$RUNNER_TEMP/pin"
          rm -rf "$work"
          git clone -q . "$work"
          cd "$work"
          eval "$(opam env --switch="$sw" --set-switch)"
          # Annotated: `git describe` ignores lightweight tags.
          git -c user.email=ci@example.com -c user.name=ci tag -a v9.9.9 -m "staged release"
          dune subst
          dune build tooling/cli/writ.exe
          got=$(./_build/default/tooling/cli/writ.exe --version | head -n 1)
          test "$got" = "writ 9.9.9" || {
            echo "a pin at tag v9.9.9 reports '$got', not 'writ 9.9.9'" >&2
            echo "dune-project after subst: $(grep '^(version' dune-project)" >&2
            exit 1; }
          echo "a pin at v9.9.9 reports $got, like every other route"

      - run: sh scripts/test-check-release-tag.sh

  # Build, install and use the tarball on both architectures; keep nothing.
  tarball:
    uses: ./.github/workflows/tarball-build.yml
