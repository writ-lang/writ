# Build the runtime image on every pull request, and never push it.
#
# WHY THIS EXISTS. Dockerfile stage 1 does not copy the repository; it copies a
# hand-written list of directories, one COPY per library, and that list is
# deliberately the check that `writ` and `writ-mcp` are a small closed set. The
# cost of that design is a failure mode: a library added to a dune file and not
# added to the list builds everywhere except in the image. `writ_sql` did
# exactly that, and because publishing fires only on a v* tag or by hand, nobody
# saw it until the release. This workflow is the thing that sees it — on the
# pull request that causes it, not on the release that trips over it.
#
# It shares its build with image-publish.yml rather than copying it: both call
# image-build.yml, which is where the matrix and the buildx invocation live. A
# check that built something other than what ships would not be a check, and two
# copies of the matrix is how that drift would have arrived.
#
# NOT A JOB IN image-publish.yml, and the reason is the token. That workflow
# holds `packages: write` so it can push to GHCR; nothing triggered by a pull
# request should be able to publish. Job-level permissions could express that in
# one file, but only as long as every future job remembers to set them — a job
# added without its own block inherits the file's. Two files, two permission
# sets, and the mistake is unavailable rather than merely discouraged.
#
# It BUILDS AND STOPS. Every check worth running is already a RUN in the
# Dockerfile's second stage — the model, the .rules file, the MCP handshake and
# git — so producing the image is the whole test, and there is nothing to run
# afterwards that the build has not already run.

name: image-check

on:
  pull_request:
  push:
    branches: [main]

# Read the tree, and nothing else. Because a called workflow is capped by its
# caller's grant, this line is what makes it impossible for image-build.yml to
# push when it is called from here, whatever that file asks for.
permissions:
  contents: read

# A pull request that gets three pushes in a minute needs one build, not three.
concurrency:
  group: image-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NO `paths:` FILTER ON THE TRIGGER, on purpose. A paths filter is the same
  # kind of object as the COPY list it is guarding — a hand-kept enumeration of
  # what matters — and the drift it would have to catch arrived in
  # tooling/cli/dune, not in the Dockerfile. A filter listing only the obvious
  # files would have skipped the very commit that broke the image. So every pull
  # request builds, and the per-architecture cache is what keeps that affordable
  # enough that nobody is tempted to add the filter back later.
  build:
    uses: ./.github/workflows/image-build.yml
