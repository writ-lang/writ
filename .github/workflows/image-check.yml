# Build the runtime image on every pull request, and never push it. This is
# what catches a library added to a dune file but not to the Dockerfile's COPY
# list. The smoke checks are RUNs in the Dockerfile, so the build is the test.
# Kept apart from image-publish.yml so no pull-request job holds
# `packages: write`.

name: image-check

on:
  pull_request:
  push:
    branches: [main]

# Caps image-build.yml too: called from here it cannot push.
permissions:
  contents: read

concurrency:
  group: image-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `paths:` filter: the breakage this guards against arrives in dune files
  # that such a filter would not list.
  build:
    uses: ./.github/workflows/image-build.yml
