# Publish the runtime image to GHCR, for amd64 and arm64.
#
# WHY A WORKFLOW AND NOT A LOCAL `docker push`. GHCR is a container registry
# speaking the Docker Registry HTTP API, so it authenticates with a bearer
# token — an SSH key pushes git, and cannot push an image. A personal access
# token with `write:packages` would work; the built-in GITHUB_TOKEN below does
# too, and is scoped to this repository and this run rather than to a person.
# Nothing has to be stored anywhere.
#
# NOT ON EVERY PUSH, deliberately. Publishing is outward-facing and the version
# it carries comes from dune-project, so it fires on a tag — the moment a
# version means something — or by hand from the Actions tab.
#
# TWO ARCHITECTURES, BUILT ON TWO MACHINES. The first published image was
# amd64-only, which does not fail for an Apple Silicon user — it does something
# worse, and silently: Docker pulls the amd64 image and runs the whole thing
# under QEMU. An interrogator that enumerates a state space is exactly the kind
# of program that turns emulation into a wait, so "it works" and "it is usable"
# came apart without an error message anywhere.
#
# The fix is a manifest list, and it is built the long way: each architecture on
# a runner of that architecture, then one `imagetools create` to join them.
# Setting `platforms: linux/amd64,linux/arm64` on a single runner is one line
# instead of two jobs, and it would compile OCaml for arm64 under QEMU on an
# amd64 host — the same emulation, moved from the user to CI, where it also has
# to run the stage-2 smoke checks emulated. arm64 runners are free on public
# repositories, so the honest version costs nothing but this comment.

name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish alongside the version (e.g. latest)"
        default: "latest"

permissions:
  contents: read
  packages: write          # what lets GITHUB_TOKEN push to ghcr.io

jobs:
  # One job per architecture, each pushing an image with NO TAG — `push-by-digest`
  # puts the bytes in the registry and hands back a digest, and the tags are
  # attached once, later, by the job below. Tagging here instead would mean two
  # jobs racing to claim the same tag, and whichever finished last would win: the
  # published `:0.1.0` would be single-architecture again, which is the bug this
  # workflow is fixing.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      # The digest is the only thing the merge job needs, and an artifact is how
      # a value crosses between jobs on different machines. An empty file NAMED
      # for the digest rather than a file containing it: the merge job globs the
      # directory, so it never has to know how many architectures there were.
      - name: record the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Join the per-architecture images under the real tags, then prove the join
  # worked. This is the only job that names a version, so the sed that reads it
  # stays in one place.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version dune-project holds is the one `writ --version` prints and
      # `make release` names its tarball with. Read it rather than repeating
      # it: a hand-kept copy of a version number is one that goes wrong.
      - id: v
        run: echo "version=$(sed -n 's/^(version \(.*\))/\1/p' dune-project)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }} \
            --tag ghcr.io/${{ github.repository }}:${{ inputs.tag || 'latest' }} \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      # Two checks, and they are checking different things.
      #
      # The first is the one this workflow gained: that the tag is a manifest
      # list naming BOTH architectures. Nothing else can catch a half-published
      # tag — the amd64 image alone pulls and runs perfectly well on the amd64
      # runner below, which is exactly how the arm64 gap went unnoticed the
      # first time.
      #
      # The second is the one only a publish can make: that the bytes which
      # reached the registry come back down and run. The image's own smoke test
      # is a RUN in the Dockerfile's second stage, so it has already passed on
      # each architecture natively, on that architecture's machine, before
      # anything was pushed.
      - name: check the manifest carries both architectures
        run: |
          image=ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
          docker buildx imagetools inspect "$image"
          for want in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "$image" | grep -q "$want" \
              || { echo "manifest for $image is missing $want" >&2; exit 1; }
          done

      - run: docker run --rm ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }} --version
