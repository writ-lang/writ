# Build the runtime image for both architectures. Called, never triggered:
# image-check.yml (push: false, cacheonly) and image-publish.yml (push: true,
# by digest, untagged) share this one build so the check builds what ships.
# A called workflow is capped by its caller's permissions, so the check cannot
# push.

name: image-build

on:
  workflow_call:
    inputs:
      push:
        description: "Push each architecture to GHCR by digest, and record it"
        type: boolean
        default: false

jobs:
  build:
    # Each architecture on a native runner, never QEMU: emulation makes the
    # state-space search, and the stage-2 smoke checks, painfully slow.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest and let the caller tag: two matrix jobs tagging would race,
      # and the loser's architecture would be published alone. The cache is
      # scoped per architecture so the two jobs do not evict each other.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: ${{ inputs.push && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # An empty file named for the digest, so the merge job can glob them all.
      - if: inputs.push
        name: record the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
