# Publish the runtime image to GHCR, for amd64 and arm64, on a v* tag or by
# hand. The build is image-build.yml, shared with image-check.yml.

name: image-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish alongside the version (e.g. latest)"
        default: "latest"

permissions:
  contents: read

jobs:
  # `packages: write` is granted per job, not file-wide, so later jobs do not
  # inherit it.
  build:
    permissions:
      contents: read
      packages: write        # what lets GITHUB_TOKEN push to ghcr.io
    uses: ./.github/workflows/image-build.yml
    with:
      push: true

  # Join the per-architecture images under the real tags, then check the join.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the check below compares this tag against the others

      - id: v
        run: echo "version=$(sed -n 's/^(version \(.*\))/\1/p' dune-project)" >> "$GITHUB_OUTPUT"

      # The version comes from dune-project, not the tag; refuse to publish if
      # they differ, before anything is tagged.
      - name: the tag and dune-project must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh scripts/check-release-tag.sh "${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }} \
            --tag ghcr.io/${{ github.repository }}:${{ inputs.tag || 'latest' }} \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      # A half-published tag still runs on the amd64 runner, so check the manifest
      # names both architectures, then pull and run what reached the registry.
      - name: check the manifest carries both architectures
        run: |
          image=ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
          docker buildx imagetools inspect "$image"
          for want in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "$image" | grep -q "$want" \
              || { echo "manifest for $image is missing $want" >&2; exit 1; }
          done

      - run: docker run --rm ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }} --version
