# Run every repository that uses writ against this checkout (downstream/Dockerfile),
# so a change that breaks a dependent fails on its pull request, not after
# release. The build is the test: each suite is a RUN in its own stage.
# The nightly schedule catches dependents that changed while writ did not.

name: downstream

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      problems_ref:
        description: "writ-problems branch, tag or commit"
        default: main
      arch_ref:
        description: "writ-arch branch, tag or commit"
        default: main
      scheduling_ref:
        description: "writ-scheduling-verification branch, tag or commit"
        default: main
      mgtt2writ_ref:
        description: "mgtt2writ branch, tag or commit"
        default: main
      vscode_ref:
        description: "writ-vscode branch, tag or commit"
        default: main

permissions:
  contents: read

concurrency:
  group: downstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  downstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Resolve refs to commits with the same script `make downstream` uses, so
      # clone layers cache on the commit, not on "main".
      - id: refs
        env:
          PROBLEMS_REF: ${{ inputs.problems_ref || 'main' }}
          ARCH_REF: ${{ inputs.arch_ref || 'main' }}
          SCHEDULING_REF: ${{ inputs.scheduling_ref || 'main' }}
          MGTT2WRIT_REF: ${{ inputs.mgtt2writ_ref || 'main' }}
          VSCODE_REF: ${{ inputs.vscode_ref || 'main' }}
        run: |
          {
            echo "args<<EOF"
            sh downstream/build.sh --print-args
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Own cache scope, so it does not evict the runtime image's layers.
      - uses: docker/build-push-action@v7
        env:
          # Plain, so each suite's full output is in the log.
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: downstream/Dockerfile
          build-args: ${{ steps.refs.outputs.args }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=downstream
          cache-to: type=gha,mode=max,scope=downstream
